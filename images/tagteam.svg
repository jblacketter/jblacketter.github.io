<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- The tagteam cockpit (3.x): Now strip, Lead / Reviewer lanes, Activity log, Needs-you card -->

  <!-- Now strip -->
  <rect x="10" y="10" width="380" height="22" rx="6" fill="#1a2332" stroke="#0fbcbf" stroke-width="1"/>
  <text x="20" y="25" fill="#0fbcbf" font-family="monospace" font-size="9" font-weight="600">NOW</text>
  <text x="50" y="25" fill="#8899aa" font-family="monospace" font-size="9">phase 43 · impl · r2</text>
  <text x="180" y="25" fill="#8899aa" font-family="monospace" font-size="9">turn: reviewer 4m</text>
  <circle cx="288" cy="21" r="3" fill="#34d399"/>
  <text x="295" y="25" fill="#8899aa" font-family="monospace" font-size="9">watcher headless</text>

  <!-- Lead lane -->
  <rect x="10" y="40" width="185" height="58" rx="6" fill="#1a2332" stroke="#a78bfa" stroke-width="1"/>
  <text x="20" y="55" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="600">LEAD</text>
  <text x="52" y="55" fill="#8899aa" font-family="monospace" font-size="9">claude -p</text>
  <text x="20" y="72" fill="#8899aa" font-family="monospace" font-size="9">r2 SUBMIT_FOR_REVIEW</text>
  <text x="20" y="86" fill="#34d399" font-family="monospace" font-size="9">✓ gate pass · pytest 512</text>

  <!-- Turn token: handoff arrow, lead → reviewer -->
  <line x1="160" y1="90" x2="198" y2="90" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="197,86 205,90 197,94" fill="#a78bfa"/>

  <!-- Reviewer lane (on turn, running) -->
  <rect x="205" y="40" width="185" height="58" rx="6" fill="#1a2332" stroke="#e8a838" stroke-width="1.5"/>
  <text x="215" y="55" fill="#e8a838" font-family="monospace" font-size="10" font-weight="600">REVIEWER</text>
  <text x="275" y="55" fill="#8899aa" font-family="monospace" font-size="9">codex exec</text>
  <rect x="340" y="46" width="42" height="12" rx="6" fill="rgba(232,168,56,0.18)" stroke="#e8a838" stroke-width="0.8"/>
  <text x="361" y="55" text-anchor="middle" fill="#e8a838" font-family="monospace" font-size="7">ON TURN</text>
  <text x="215" y="72" fill="#8899aa" font-family="monospace" font-size="9">panel: correctness · scope</text>
  <text x="215" y="86" fill="#e8a838" font-family="monospace" font-size="9">● verification lens running…</text>

  <!-- Activity log -->
  <rect x="10" y="106" width="255" height="84" rx="6" fill="#1a2332" stroke="#0fbcbf" stroke-width="1"/>
  <rect x="10" y="106" width="255" height="16" rx="6" fill="#2a3545"/>
  <rect x="10" y="116" width="255" height="6" fill="#2a3545"/>
  <text x="20" y="117" fill="#0fbcbf" font-family="monospace" font-size="9" font-weight="600">ACTIVITY</text>
  <text x="20" y="136" fill="#34d399" font-family="monospace" font-size="8">✓</text>
  <text x="32" y="136" fill="#8899aa" font-family="monospace" font-size="8">lead · impl r1 · finished · 211s</text>
  <text x="20" y="149" fill="#e8a838" font-family="monospace" font-size="8">↩</text>
  <text x="32" y="149" fill="#8899aa" font-family="monospace" font-size="8">reviewer · REQUEST_CHANGES</text>
  <text x="20" y="162" fill="#34d399" font-family="monospace" font-size="8">✓</text>
  <text x="32" y="162" fill="#8899aa" font-family="monospace" font-size="8">gate · pass · tests green</text>
  <text x="20" y="175" fill="#e8a838" font-family="monospace" font-size="8">●</text>
  <text x="32" y="175" fill="#e8a838" font-family="monospace" font-size="8">panel · 3 lenses · streaming log</text>
  <text x="20" y="186" fill="#445566" font-family="monospace" font-size="7">tokens: 1.4M in · 16k out</text>

  <!-- Needs you (arbiter) card -->
  <rect x="275" y="106" width="115" height="84" rx="6" fill="#1a2332" stroke="#34d399" stroke-width="1"/>
  <rect x="275" y="106" width="115" height="16" rx="6" fill="#2a3545"/>
  <rect x="275" y="116" width="115" height="6" fill="#2a3545"/>
  <text x="285" y="117" fill="#34d399" font-family="monospace" font-size="9" font-weight="600">NEEDS YOU</text>
  <text x="285" y="136" fill="#8899aa" font-family="monospace" font-size="8">arbiter · 0 open</text>
  <text x="285" y="149" fill="#8899aa" font-family="monospace" font-size="8">escalations: none</text>
  <rect x="285" y="158" width="95" height="14" rx="4" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="0.8"/>
  <text x="332" y="168" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="8">interject →</text>
  <text x="285" y="184" fill="#445566" font-family="monospace" font-size="7">tagteam serve · hub</text>
</svg>
