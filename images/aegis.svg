<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Terminal window -->
  <rect x="10" y="10" width="380" height="180" rx="8" fill="#1a2332" stroke="#0fbcbf" stroke-width="1" opacity="0.9"/>
  <!-- Title bar -->
  <rect x="10" y="10" width="380" height="28" rx="8" fill="#253545"/>
  <rect x="10" y="30" width="380" height="8" fill="#253545"/>
  <circle cx="28" cy="24" r="5" fill="#f97066"/>
  <circle cx="44" cy="24" r="5" fill="#e8a838"/>
  <circle cx="60" cy="24" r="5" fill="#34d399"/>
  <text x="200" y="27" text-anchor="middle" fill="#94a7ba" font-family="monospace" font-size="11">aegis · scan console</text>
  <!-- Scan command -->
  <text x="24" y="56" fill="#0fbcbf" font-family="monospace" font-size="10">$</text>
  <text x="36" y="56" fill="#e4ecf0" font-family="monospace" font-size="10">aegis scan ~/projects/myapp</text>
  <!-- Scan steps -->
  <text x="24" y="76" fill="#34d399" font-family="monospace" font-size="9">✓ Discovering surface area...</text>
  <text x="230" y="76" fill="#8899aa" font-family="monospace" font-size="9">42 routes · auth · APIs</text>
  <text x="24" y="92" fill="#34d399" font-family="monospace" font-size="9">✓ Scoring risk...</text>
  <text x="230" y="92" fill="#e8a838" font-family="monospace" font-size="9">7 high · 12 medium</text>
  <text x="24" y="108" fill="#34d399" font-family="monospace" font-size="9">✓ Building test plan...</text>
  <text x="230" y="108" fill="#8899aa" font-family="monospace" font-size="9">prioritized · pyramid</text>
  <text x="24" y="124" fill="#34d399" font-family="monospace" font-size="9">✓ Generating tests...</text>
  <text x="230" y="124" fill="#8899aa" font-family="monospace" font-size="9">pytest · behave · playwright</text>
  <text x="24" y="140" fill="#e8a838" font-family="monospace" font-size="9">◐ Writing app docs...</text>
  <text x="230" y="140" fill="#8899aa" font-family="monospace" font-size="9">features · journeys · maps</text>
  <!-- Bottom status -->
  <rect x="24" y="152" width="352" height="1" fill="#334455"/>
  <text x="24" y="172" fill="#0fbcbf" font-family="monospace" font-size="10">Tier: LOCAL AI · on-device</text>
  <text x="252" y="172" fill="#34d399" font-family="monospace" font-size="10">CODE STAYS LOCAL</text>
</svg>
