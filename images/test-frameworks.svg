<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Terminal window -->
  <rect x="10" y="10" width="380" height="180" rx="8" fill="#1a2332" stroke="#0fbcbf" stroke-width="1" opacity="0.9"/>
  <!-- Title bar -->
  <rect x="10" y="10" width="380" height="28" rx="8" fill="#253545"/>
  <rect x="10" y="30" width="380" height="8" fill="#253545"/>
  <circle cx="28" cy="24" r="5" fill="#f97066"/>
  <circle cx="44" cy="24" r="5" fill="#e8a838"/>
  <circle cx="60" cy="24" r="5" fill="#34d399"/>
  <text x="200" y="27" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="11">test-frameworks</text>
  <!-- Left panel: Playwright -->
  <text x="24" y="56" fill="#0fbcbf" font-family="monospace" font-size="10">PLAYWRIGHT + TYPESCRIPT</text>
  <rect x="24" y="60" width="160" height="1" fill="#0fbcbf" opacity="0.3"/>
  <text x="24" y="76" fill="#e4ecf0" font-family="monospace" font-size="9">$ npx playwright test</text>
  <text x="24" y="92" fill="#34d399" font-family="monospace" font-size="9">✓ login.spec.ts</text>
  <text x="140" y="92" fill="#8899aa" font-family="monospace" font-size="8">(1.2s)</text>
  <text x="24" y="106" fill="#34d399" font-family="monospace" font-size="9">✓ checkout.spec.ts</text>
  <text x="140" y="106" fill="#8899aa" font-family="monospace" font-size="8">(2.1s)</text>
  <text x="24" y="120" fill="#34d399" font-family="monospace" font-size="9">✓ search.spec.ts</text>
  <text x="140" y="120" fill="#8899aa" font-family="monospace" font-size="8">(0.8s)</text>
  <text x="24" y="138" fill="#0fbcbf" font-family="monospace" font-size="9">3 passed</text>
  <text x="80" y="138" fill="#8899aa" font-family="monospace" font-size="9">| 3 browsers</text>
  <!-- Divider -->
  <line x1="200" y1="48" x2="200" y2="180" stroke="#334455" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Right panel: BDD -->
  <text x="216" y="56" fill="#e8a838" font-family="monospace" font-size="10">BDD + PYTHON BEHAVE</text>
  <rect x="216" y="60" width="160" height="1" fill="#e8a838" opacity="0.3"/>
  <text x="216" y="76" fill="#e4ecf0" font-family="monospace" font-size="9">$ behave --tags=@smoke</text>
  <text x="216" y="92" fill="#a78bfa" font-family="monospace" font-size="9">Feature: User Login</text>
  <text x="216" y="106" fill="#34d399" font-family="monospace" font-size="9">  ✓ Given valid creds</text>
  <text x="216" y="120" fill="#34d399" font-family="monospace" font-size="9">  ✓ When user submits</text>
  <text x="216" y="134" fill="#34d399" font-family="monospace" font-size="9">  ✓ Then dashboard loads</text>
  <!-- Bottom summary -->
  <rect x="24" y="152" width="352" height="1" fill="#334455"/>
  <text x="24" y="170" fill="#34d399" font-family="monospace" font-size="10">Combined:</text>
  <text x="100" y="170" fill="#e4ecf0" font-family="monospace" font-size="10">12 scenarios, 36 steps</text>
  <text x="310" y="170" fill="#34d399" font-family="monospace" font-size="10">ALL PASS</text>
</svg>
