<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <!-- Terminal window -->
  <rect x="10" y="10" width="380" height="180" rx="8" fill="#1a2332" stroke="#a78bfa" stroke-width="1" opacity="0.9"/>
  <!-- Title bar -->
  <rect x="10" y="10" width="380" height="28" rx="8" fill="#253545"/>
  <rect x="10" y="30" width="380" height="8" fill="#253545"/>
  <circle cx="28" cy="24" r="5" fill="#f97066"/>
  <circle cx="44" cy="24" r="5" fill="#e8a838"/>
  <circle cx="60" cy="24" r="5" fill="#34d399"/>
  <text x="200" y="27" text-anchor="middle" fill="#8899aa" font-family="monospace" font-size="11">isolated-claw</text>
  <!-- Environment grid -->
  <text x="24" y="56" fill="#a78bfa" font-family="monospace" font-size="10">ENVIRONMENT: constrained-room-7</text>
  <rect x="24" y="62" width="160" height="90" rx="4" fill="none" stroke="#a78bfa" stroke-width="0.8" opacity="0.4" stroke-dasharray="3,2"/>
  <!-- Room contents -->
  <text x="34" y="78" fill="#8899aa" font-family="monospace" font-size="9">┌─────────────┐</text>
  <text x="34" y="90" fill="#8899aa" font-family="monospace" font-size="9">│ ◉ agent     │</text>
  <text x="34" y="102" fill="#8899aa" font-family="monospace" font-size="9">│   ▪ key     │</text>
  <text x="34" y="114" fill="#8899aa" font-family="monospace" font-size="9">│      ◇ door │</text>
  <text x="34" y="126" fill="#8899aa" font-family="monospace" font-size="9">│  ? clue     │</text>
  <text x="34" y="138" fill="#8899aa" font-family="monospace" font-size="9">└─────────────┘</text>
  <!-- Agent log -->
  <text x="210" y="56" fill="#a78bfa" font-family="monospace" font-size="10">AGENT REASONING</text>
  <rect x="210" y="60" width="166" height="1" fill="#a78bfa" opacity="0.3"/>
  <text x="210" y="76" fill="#e4ecf0" font-family="monospace" font-size="9">Turn 14/50</text>
  <text x="310" y="76" fill="#e8a838" font-family="monospace" font-size="9">exploring</text>
  <text x="210" y="93" fill="#34d399" font-family="monospace" font-size="9">&gt; examine clue</text>
  <text x="210" y="107" fill="#8899aa" font-family="monospace" font-size="9">"cipher fragment... the</text>
  <text x="210" y="119" fill="#8899aa" font-family="monospace" font-size="9"> key rotates left by 3"</text>
  <text x="210" y="136" fill="#a78bfa" font-family="monospace" font-size="9">&gt; hypothesis: Caesar</text>
  <text x="210" y="148" fill="#a78bfa" font-family="monospace" font-size="9">  cipher on door code</text>
  <!-- Bottom status -->
  <rect x="24" y="160" width="352" height="1" fill="#334455"/>
  <text x="24" y="178" fill="#a78bfa" font-family="monospace" font-size="10">Score:</text>
  <text x="70" y="178" fill="#e4ecf0" font-family="monospace" font-size="10">3/5 rooms escaped</text>
  <text x="260" y="178" fill="#e8a838" font-family="monospace" font-size="10">Creativity: 87%</text>
</svg>
